<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 5</title>
    <link rel="stylesheet" href="./css/all.css">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/index.responsive.css">
</head>

<body>
    <section id="Register">
        <div class="container">
            <div class="head my-5 text-center">
                <img src="./images/logo-be01d065.png" alt="">
            </div>
            <div class="body">
                <form action="" class="m-auto p-3 rounded-4" data-type="add">
                    <h3 class="mb-3 text-center">Students System</h3>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" name="firstName" placeholder="First Name *" required
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="firstName" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" name="lastName" placeholder="Last Name *" required
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="lastName" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="text" class="form-control" name="email" placeholder="Email *" required
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="email" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-hashtag"></i>
                        </span>
                        <input type="text" class="form-control" name="age" placeholder="Age *" required
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="age" role="alert"></p>

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-mobile-button"></i>
                        </span>
                        <input type="text" class="form-control" name="phone" placeholder="Phone *" required
                            onblur="checkInput(this)" data-valid="false">
                    </div>
                    <p class="alert alert-danger d-none" data-error-name="phone" role="alert"></p>

                    <button class="btn btn-success w-100">Add</button>
                </form>
            </div>
        </div>
    </section>

    <section id="Search" class="my-5 mx-auto w-25">
        <div class="input-group mb-3">
            <span class="input-group-text">
                <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" class="form-control" name="Search" id="SearchInput" placeholder="Search...">
        </div>
    </section>

    <section id="Data" class="w-75 m-auto mb-5">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Option</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="tableAlert" class="table-warning text-center" colspan="7">There are no data</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script src="./js/bootstrap.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/index.js"></script>
</body>

</html>
